const app=document.getElementById('app');
const escapeHtml=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const fmtTime=s=>`${String(Math.floor(s/60)).padStart(2,'0')}:${String(s%60).padStart(2,'0')}`;
const dataFor=(d)=>state.answers[d.id];
function progress(d){return d.claims.filter(c=>dataFor(d).claims[c.id]?.verdict&&dataFor(d).claims[c.id]?.source).length;}
function doneCount(){return DOSSIERS.filter(d=>dataFor(d).checked).length;}
function score(d){const a=dataFor(d).claims;return d.claims.reduce((tot,c)=>{const r=a[c.id]||{};return tot+Number(r.verdict===c.verdict)+Number(r.source===c.source)},0)}
function totalScore(){return DOSSIERS.reduce((n,d)=>n+(dataFor(d).checked?score(d):0),0)}
function setScreen(screen,idx=state.idx){state.screen=screen;state.idx=Math.max(0,Math.min(DOSSIERS.length-1,idx));state.source=0;state.selected=0;render();window.scrollTo({top:0,behavior:'instant'});}
function intro(){app.innerHTML=`<section class="card hero"><div class="eyebrow">L’IA dice. Le fonti decidono.</div><h1>Il verificatore</h1><p>Tre fascicoli simulati. Quindici affermazioni da controllare. Un testo amministrativo può essere scritto benissimo e contenere errori, inesattezze o dettagli mai documentati: qui impari a scoprirli.</p><div class="buttons" style="margin-top:24px"><button type="button" class="button primary" id="begin">Inizia la verifica →</button><button type="button" class="button secondary" id="readme">Come funziona ↓</button></div></section><section class="feature-grid"><div class="card feature"><b>3 fascicoli</b><p>Contributi, manutenzioni stradali e servizi culturali</p></div><div class="card feature"><b>15 affermazioni</b><p>Confronto puntuale con documenti e loro versioni</p></div><div class="card feature"><b>30 minuti</b><p>Timer facoltativo, nessuna scadenza forzata</p></div></section><section class="intro-grid" id="instructions"><div class="card pad"><h2>Come si gioca</h2><ol class="steps"><li>Leggi la richiesta e le cinque frasi attribuite all'assistente IA.</li><li>Consulta le fonti simulate: alcune sono aggiornate, altre sono bozze superate.</li><li>Per ogni frase indica <strong>Confermata</strong>, <strong>Smentita</strong> o <strong>Non dimostrata</strong> e cita il documento decisivo oppure «nessuna fonte sufficiente».</li><li>Scrivi una breve nota di revisione e verifica le scelte. Dopo il controllo puoi leggere il debrief, rivedere gli errori e scaricare il riepilogo.</li></ol><button class="button primary" id="begin2">Apri il primo fascicolo →</button></div><div class="card pad"><h2>Cosa rende difficile la verifica</h2><p>Una data precisa non è una fonte. Un documento vecchio non prevale su uno aggiornato. E una frase non documentata non è automaticamente falsa.</p><div class="notice">Tutti i nomi, i documenti, i regolamenti e le procedure sono <strong>inventati</strong> per la simulazione. Nessuna indicazione è un parere giuridico o una fonte amministrativa reale.</div><p class="small-text muted" style="margin-top:15px">Si utilizza senza account, Internet o servizi di IA. Le scelte restano sul dispositivo; nessun dato viene inviato a server.</p></div></section>`;
for(const id of ['begin','begin2'])document.getElementById(id).onclick=()=>setScreen('case',0);
document.getElementById('readme').onclick=()=>document.getElementById('instructions').scrollIntoView({behavior:'smooth'});}
function markStatus(d,c){const r=dataFor(d).claims[c.id];return r?.verdict&&r?.source?'✓ Valutata':'Da verificare';}
function sourceHtml(d){const doc=d.docs[state.source];return `<section class="card sources" id="sourcesArea"><div class="panel-title"><div><div class="eyebrow">Fascicolo documentale</div><h2>Fonti a disposizione</h2></div><span class="pill">${d.docs.length} documenti</span></div><div class="source-tabs" aria-label="Documenti consultabili">${d.docs.map((s,i)=>`<button type="button" data-sourcetab="${i}" class="${i===state.source?'active':''}" aria-pressed="${i===state.source}">${escapeHtml(s.id)} · ${escapeHtml(s.type)}</button>`).join('')}</div><article class="paper"><small>${escapeHtml(doc.type)} · ${escapeHtml(doc.status)}</small><h3>${escapeHtml(doc.name)}</h3><div class="paper-meta">Comune fittizio di Vallechiara · ${escapeHtml(doc.date)} · Rif. ${escapeHtml(doc.id)}</div><ul>${doc.items.map(i=>`<li>${escapeHtml(i)}</li>`).join('')}</ul><div class="source-foot">Documento simulato per questa esercitazione · Non è un atto realmente vigente</div></article><div class="source-warning">Controlla sempre data, versione e stato del documento prima di considerarlo una prova.</div></section>`;}
function responseHtml(d){return `<section class="card ai-response"><div class="panel-title"><div><div class="eyebrow">Bozza prodotta dall’IA · NON verificata</div><h2>Le affermazioni da esaminare</h2></div><span class="pill">${progress(d)}/${d.claims.length} controllate</span></div><div class="chat-top"><strong>Richiesta:</strong> ${escapeHtml(d.request)}</div><p class="quote">L’assistente ha proposto queste cinque affermazioni. Selezionane una per annotare l’esito e la fonte.</p>${d.claims.map((c,i)=>`<button class="claim ${i===state.selected?'active':''} ${markStatus(d,c).startsWith('✓')?'done':''}" type="button" data-claim="${i}" aria-pressed="${i===state.selected}"><span class="claim-index">${i+1}</span><span class="claim-main"><strong>AFFERMAZIONE ${i+1}</strong><span>${escapeHtml(c.text)}</span></span><span class="claim-status">${markStatus(d,c)}</span></button>`).join('')}</section>`;}
function inspectionHtml(d){const c=d.claims[state.selected],r=dataFor(d).claims[c.id]||{};return `<section class="card inspection"><div class="eyebrow">La tua valutazione · Frase ${state.selected+1}/${d.claims.length}</div><h3>Che cosa dicono le fonti?</h3><p class="small-text"><a href="#sourcesArea">Consulta i documenti del fascicolo ↗</a></p><div class="snippet">«${escapeHtml(c.text)}»</div><label>1 · Esito della verifica</label><div class="class-grid">${Object.entries(VERDICTS).map(([v,l])=>`<button type="button" data-verdict="${v}" class="classbtn ${r.verdict===v?'active':''}" aria-pressed="${r.verdict===v}"><strong>${l}</strong><small>${v==='yes'?'Una fonte lo prova':v==='no'?'Una fonte lo contraddice':'Non ci sono prove sufficienti'}</small></button>`).join('')}</div><label for="evidence">2 · Fonte decisiva</label><select id="evidence"><option value="">Seleziona la prova…</option>${d.docs.map(s=>`<option value="${s.id}" ${r.source===s.id?'selected':''}>${escapeHtml(s.id)} · ${escapeHtml(s.name)}</option>`).join('')}<option value="none" ${r.source==='none'?'selected':''}>Nessuna fonte sufficiente</option></select><p class="fieldhelp">Per «non dimostrata», indica «Nessuna fonte sufficiente». Per «confermata» o «smentita», cita il documento che prova o contraddice la frase.</p><div class="buttons" style="justify-content:space-between;margin-top:13px"><button class="button secondary small" id="prevClaim" ${state.selected===0?'disabled':''}>← Frase precedente</button><button class="button primary small" id="nextClaim">${state.selected===d.claims.length-1?'Fonte e riepilogo ↓':'Frase successiva →'}</button></div></section>`;}
function editorHtml(d){const a=dataFor(d);return `<section class="card editor bottom" id="reviewNote"><div class="eyebrow">Dal controllo alla correzione</div><h2>Nota del revisore</h2><p>Scrivi in poche righe che cosa correggeresti prima di utilizzare la bozza. Non serve riscrivere tutto il testo; segnala almeno un errore e un'informazione da non dare per certa.</p><label for="reviewText" class="sr-only">Nota del revisore</label><textarea id="reviewText" placeholder="Esempio: la soglia è diversa nell'avviso definitivo; la promessa di invio SMS non è confermata dalle fonti disponibili…">${escapeHtml(a.note)}</textarea><p class="small-text">Queste note non vengono inviate da nessuna parte e saranno incluse soltanto nel report esportato.</p></section>`;}
function resultsHtml(d){const a=dataFor(d);return `<section class="card feedback" id="results"><div class="eyebrow">Debrief · Le fonti prima delle impressioni</div><h2>Controllo del fascicolo</h2><div class="stats"><span>${score(d)} / ${d.claims.length*2} riscontri coerenti</span><span>${d.claims.length} affermazioni esaminate</span><span>Nota: ${a.note.trim()?'presente':'non inserita'}</span></div><p class="small-text muted">Ogni affermazione vale un punto per l'esito e uno per la fonte. Il risultato è orientativo: serve a discutere la qualità della verifica, non a certificare competenze.</p>${d.claims.map((c,i)=>{const r=a.claims[c.id]||{};const right=r.verdict===c.verdict&&r.source===c.source;return `<div class="answer"><h3>${i+1}. ${escapeHtml(c.text)}</h3><div class="key ${right?'':'miss'}">${right?'✓ Valutazione coerente':'Da rivedere'} · ${VERDICTS[c.verdict]} · Fonte: ${c.source==='none'?'nessuna fonte sufficiente':c.source}</div><p>${escapeHtml(c.why)}</p>${right?'':`<p>La tua scelta: ${escapeHtml(VERDICTS[r.verdict]||'non selezionata')} · ${escapeHtml(r.source==='none'?'nessuna fonte sufficiente':r.source||'fonte non scelta')}</p>`}</div>`}).join('')}<div class="corrected"><strong>Una possibile versione corretta della comunicazione</strong><p style="margin:8px 0 0">${escapeHtml(d.model)}</p></div><div class="buttons"><button class="button secondary" id="backEdit">Rivedi le scelte</button><button class="button primary" id="afterResult">${state.idx===DOSSIERS.length-1?'Vai al riepilogo →':'Fascicolo successivo →'}</button></div></section>`;}
function casePage(){const d=DOSSIERS[state.idx],a=dataFor(d);app.innerHTML=`<div class="progress-top"><span class="pill">Fascicolo ${state.idx+1} di ${DOSSIERS.length} · ${escapeHtml(d.area)}</span><span class="small-text muted">${doneCount()} fascicoli verificati · ${progress(d)}/${d.claims.length} affermazioni valutate · ${escapeHtml(d.duration)}</span></div><div class="bar"><div class="fill" style="width:${doneCount()/DOSSIERS.length*100}%"></div></div><nav class="nav-tabs" aria-label="Scegli un fascicolo">${DOSSIERS.map((v,i)=>`<button type="button" data-nav="${i}" class="${i===state.idx?'active':''} ${dataFor(v).checked?'done':''}" aria-current="${i===state.idx?'step':'false'}">${dataFor(v).checked?'✓ ':''}${i+1}. ${escapeHtml(v.area)}</button>`).join('')}</nav><div class="case-head"><div class="eyebrow">L'IA dice, le fonti decidono</div><h1>${escapeHtml(d.title)}</h1><p>${escapeHtml(d.objective)}</p></div><div class="workbench"><div class="left-column">${responseHtml(d)}${inspectionHtml(d)}</div><div class="right-column">${sourceHtml(d)}</div></div>${editorHtml(d)}<div class="endbar"><div class="buttons"><button class="button secondary" id="caseBack" ${state.idx===0?'disabled':''}>← Fascicolo precedente</button><button class="button secondary" id="caseForward">${state.idx===DOSSIERS.length-1?'Apri riepilogo':'Fascicolo successivo →'}</button></div><button class="button primary" id="evaluate">Verifica il fascicolo (${progress(d)}/${d.claims.length})</button></div><div id="formError" class="error hidden" role="alert"></div>${a.checked?resultsHtml(d):''}`;
for(const b of document.querySelectorAll('[data-nav]'))b.onclick=()=>setScreen('case',Number(b.dataset.nav));
for(const b of document.querySelectorAll('[data-sourcetab]'))b.onclick=()=>{state.source=Number(b.dataset.sourcetab);refreshCase(false);};
for(const b of document.querySelectorAll('[data-claim]'))b.onclick=()=>{state.selected=Number(b.dataset.claim);refreshCase(window.innerWidth<980);};
for(const b of document.querySelectorAll('[data-verdict]'))b.onclick=()=>{const c=d.claims[state.selected];a.claims[c.id]={...(a.claims[c.id]||{}),verdict:b.dataset.verdict};a.checked=false;refreshCase(false);};
document.getElementById('evidence').onchange=e=>{const c=d.claims[state.selected];a.claims[c.id]={...(a.claims[c.id]||{}),source:e.target.value};a.checked=false;refreshCase(false);};
document.getElementById('prevClaim').onclick=()=>{state.selected--;refreshCase(false);};
document.getElementById('nextClaim').onclick=()=>{if(state.selected===d.claims.length-1){document.getElementById('reviewNote').scrollIntoView({behavior:'smooth',block:'center'});}else{state.selected++;refreshCase(false);}};
document.getElementById('reviewText').oninput=e=>{a.note=e.target.value;};
document.getElementById('evaluate').onclick=()=>{const missing=d.claims.length-progress(d);if(missing){const err=document.getElementById('formError');err.textContent=`Mancano ancora ${missing} verifiche complete: per ogni frase scegli un esito e una fonte.`;err.classList.remove('hidden');err.scrollIntoView({behavior:'smooth',block:'center'});return;}a.checked=true;refreshCase(false);document.getElementById('results').scrollIntoView({behavior:'smooth',block:'start'});};
document.getElementById('caseBack').onclick=()=>setScreen('case',state.idx-1);
document.getElementById('caseForward').onclick=()=>state.idx===DOSSIERS.length-1?setScreen('summary'):setScreen('case',state.idx+1);
if(a.checked){document.getElementById('backEdit').onclick=()=>{a.checked=false;refreshCase(false);};document.getElementById('afterResult').onclick=()=>state.idx===DOSSIERS.length-1?setScreen('summary'):setScreen('case',state.idx+1);}
}
// Re-render without destroying typed notes; selected values are kept in state.
function refreshCase(focusInspector){casePage();if(focusInspector)document.querySelector('.inspection').scrollIntoView({behavior:'smooth',block:'start'});}
function summaryPage(){const evaluated=DOSSIERS.filter(d=>dataFor(d).checked);const max=evaluated.reduce((n,d)=>n+d.claims.length*2,0);app.innerHTML=`<section class="card summary"><div class="eyebrow">Bilancio del lavoro di verifica</div><h1>Le tue verifiche, in sintesi</h1><p>Hai completato ${evaluated.length} fascicoli su ${DOSSIERS.length}. Il punteggio riguarda soltanto i documenti verificati, non è un attestato e non equivale a una valutazione di conformità.</p><div class="summary-grid"><div class="summary-tile"><b>${evaluated.length}/${DOSSIERS.length}</b><span>Fascicoli verificati</span></div><div class="summary-tile"><b>${totalScore()}/${max||0}</b><span>Riscontri coerenti</span></div><div class="summary-tile"><b>${evaluated.length*5}/15</b><span>Affermazioni confrontate</span></div></div>${DOSSIERS.map((d,i)=>`<div class="case-summary"><div class="eyebrow">Fascicolo ${i+1} · ${escapeHtml(d.area)}</div><h3>${escapeHtml(d.title)}</h3><p class="small-text muted">${dataFor(d).checked?`Verificato · ${score(d)}/${d.claims.length*2} riscontri coerenti`:'Da completare'}</p><button type="button" class="button outline small" data-open="${i}">${dataFor(d).checked?'Riapri il fascicolo':'Completa il fascicolo'} →</button></div>`).join('')}<div class="rules"><h2>Quattro idee da ricordare</h2><ol><li>Controllare una risposta significa confrontare ogni affermazione importante con una fonte.</li><li>Una bozza superata non ha lo stesso valore di un documento approvato e aggiornato.</li><li>Un dato preciso può essere falso; una notizia plausibile può restare non dimostrata.</li><li>Quando non ci sono prove sufficienti, non completare i vuoti con un'invenzione.</li></ol></div><div class="buttons"><button class="button primary" id="download">↓ Scarica report (.txt)</button><button class="button secondary" id="notes">Leggi tutte le note</button><button class="button outline" id="restart">Ricomincia</button></div><p class="small-text muted" style="margin-top:15px">Il report viene generato nel browser. Non viene trasmesso a server. I dati e le fonti dell'applicazione sono simulati.</p></section>`;
for(const btn of document.querySelectorAll('[data-open]'))btn.onclick=()=>setScreen('case',Number(btn.dataset.open));
document.getElementById('download').onclick=downloadReport;
document.getElementById('notes').onclick=()=>{document.getElementById('dialogText').value=DOSSIERS.map((d,i)=>`${i+1}. ${d.title}\n${dataFor(d).note||'(nessuna nota)'}`).join('\n\n');document.getElementById('printDialog').showModal();};
document.getElementById('restart').onclick=()=>{if(confirm('Cancellare le scelte e le note di questa sessione?')){DOSSIERS.forEach(d=>state.answers[d.id]={claims:{},note:'',checked:false});state.timer.running=false;state.timer.secs=1800;setScreen('intro');updateClock();}};
}
function downloadReport(){const lines=['IL VERIFICATORE','Report di verifica - esercitazione con documenti inventati',`Data di generazione: ${new Date().toLocaleString('it-IT')}`,''];DOSSIERS.forEach((d,i)=>{const a=dataFor(d);lines.push(`FASCICOLO ${i+1}: ${d.title}`,`Verificato: ${a.checked?'Sì':'No'}`,`Riscontri coerenti: ${a.checked?score(d):0}/${d.claims.length*2}`);d.claims.forEach((c,j)=>{const r=a.claims[c.id]||{};lines.push(`${j+1}. ${c.text}`,`  Scelta: ${VERDICTS[r.verdict]||'nessuna'} | Fonte: ${r.source||'nessuna selezionata'}`,`  Riscontro: ${VERDICTS[c.verdict]} | Fonte decisiva: ${c.source==='none'?'nessuna fonte sufficiente':c.source}`,`  Spiegazione: ${c.why}`)});lines.push('Nota del revisore:',a.note||'(non inserita)','',`Una versione corretta possibile: ${d.model}`,'');});lines.push('Nessun documento qui riportato costituisce un atto reale o una fonte normativa vigente.');const blob=new Blob([lines.join('\n')],{type:'text/plain;charset=utf-8'});const url=URL.createObjectURL(blob);const el=document.createElement('a');el.href=url;el.download='il-verificatore-report.txt';document.body.append(el);el.click();el.remove();setTimeout(()=>URL.revokeObjectURL(url),1200);}
function render(){if(state.screen==='intro')intro();else if(state.screen==='case')casePage();else summaryPage();}
function updateClock(){document.getElementById('clock').textContent=fmtTime(state.timer.secs);document.getElementById('timerToggle').textContent=state.timer.running?'Ⅱ Pausa':'▶ Timer';}
setInterval(()=>{if(state.timer.running&&state.timer.secs>0){state.timer.secs--;updateClock();if(state.timer.secs===0){state.timer.running=false;updateClock();document.getElementById('announcer').textContent='Il timer è terminato. Puoi continuare a lavorare.';}}},1000);
document.getElementById('timerToggle').onclick=()=>{if(state.timer.secs===0)state.timer.secs=1800;state.timer.running=!state.timer.running;updateClock();};
document.getElementById('timerReset').onclick=()=>{state.timer.running=false;state.timer.secs=1800;updateClock();};
document.getElementById('homeBtn').onclick=()=>setScreen('intro');
document.getElementById('summaryBtn').onclick=()=>setScreen('summary');
document.getElementById('fullBtn').onclick=()=>{if(document.fullscreenElement)document.exitFullscreen?.().catch(()=>{});else document.documentElement.requestFullscreen?.().catch(()=>{});};
document.getElementById('dialogClose').onclick=()=>document.getElementById('printDialog').close();
document.getElementById('dialogCopy').onclick=async()=>{const el=document.getElementById('dialogText');try{await navigator.clipboard.writeText(el.value);document.getElementById('announcer').textContent='Note copiate';}catch{el.select();document.execCommand?.('copy');document.getElementById('announcer').textContent='Note selezionate: puoi copiarle manualmente';}};
render();updateClock();
</script>
</body>
</html>
